global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ticketforge
    metrics_path: /actuator/prometheus
    static_configs:
      # app container (profile "app") and an app started on the host with mvn; whichever is up gets scraped
      - targets: ["app:8080", "host.docker.internal:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
