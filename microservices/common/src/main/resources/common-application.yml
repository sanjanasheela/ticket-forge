# Settings shared by every TicketForge service. A service imports this file and adds only its own
# name, port, database and feature settings (spring.config.import: classpath:common-application.yml).
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    username: ${DB_USER:ticketforge}
    password: ${DB_PASSWORD:ticketforge}
    hikari:
      # Deliberately small and explicit, like the monolith: pool exhaustion is a limit we measure.
      maximum-pool-size: ${DB_POOL_SIZE:30}
      minimum-idle: 5
      connection-timeout: ${DB_POOL_TIMEOUT_MS:2000}
      connection-init-sql: SET lock_timeout = '${DB_LOCK_TIMEOUT:3s}'; SET statement_timeout = '${DB_STATEMENT_TIMEOUT:10s}'
  flyway:
    # db/messaging ships the outbox tables (V900+); a service without events simply has no such folder
    locations: classpath:db/migration,classpath:db/messaging
  mvc:
    async:
      request-timeout: -1   # SSE streams manage their own timeouts

server:
  shutdown: graceful
  tomcat:
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
    accept-count: 1000

ticketforge:
  bus:
    type: ${BUS_TYPE:kafka}                  # kafka | forgelog (Phase 3C custom broker)
    forgelog:
      bootstrap: ${FORGELOG_BOOTSTRAP:localhost:9192}
  auth:
    # Dev default only. All services must share the same secret (>= 32 bytes) to verify each other's JWTs.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    access-token-ttl: 15m

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${INSTANCE_ID:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    json:
      add:
        instance: ${INSTANCE_ID:local}
