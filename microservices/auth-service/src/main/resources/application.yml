spring:
  application:
    name: auth-service
  config:
    import: classpath:common-application.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db?reWriteBatchedInserts=true}

server:
  port: ${PORT:8081}

ticketforge:
  auth:
    refresh-token-ttl: 7d
    bootstrap-admin:
      email: ${ADMIN_EMAIL:admin@ticketforge.local}
      password: ${ADMIN_PASSWORD:admin12345}
