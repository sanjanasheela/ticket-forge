# Phase 2 infrastructure. The four services run on the host (scripts/run-stack.sh), pinned to the same
# cores as the Phase 1 monolith, so the comparison is like for like. All containers use the host network so
# that Kong can reach the services at 127.0.0.1 and Kafka can advertise localhost.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# CPU layout (12 logical CPUs, see docs/phase1-baseline/TESTING.md):
#   0,1,6,7   application tier: the 4 services + Kong + Redis + Kafka (same 4 threads the monolith had)
#   2,3,8,9   PostgreSQL
#   4,5,10,11 k6
services:
  postgres:
    image: postgres:16-alpine
    container_name: tf-pg
    network_mode: host
    cpuset: "2,3,8,9"
    mem_limit: 2g
    shm_size: 256m   # parallel queries on a large database need more than the 64MB default (the invariant check failed once without it)
    environment:
      POSTGRES_USER: ticketforge
      POSTGRES_PASSWORD: ticketforge
      POSTGRES_DB: ticketforge
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketforge -d auth_db"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: tf-redis
    network_mode: host
    cpuset: "0,1,6,7"
    mem_limit: 256m
    # Port 6380, not 6379: 6379 is often taken by a Redis already running on the host.
    # cache only: no persistence, bounded memory, evict least-recently-used when full
    command: ["redis-server", "--port", "6380", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    container_name: tf-kafka
    network_mode: host
    cpuset: "0,1,6,7"
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xms384m -Xmx384m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 20

  kong:
    image: kong:3.7
    container_name: tf-kong
    network_mode: host
    cpuset: "0,1,6,7"
    mem_limit: 512m
    environment:
      KONG_DATABASE: "off"                       # DB-less: routes come from kong.yml
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8080            # the one public entry point
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
      KONG_NGINX_WORKER_PROCESSES: "2"
      # Kong's default worker_connections (1024) is far below what thousands of concurrent clients need: in the first
      # benchmark pass it logged 67,000 "worker_connections are not enough" errors and dropped requests that never
      # reached the services (see docs/PHASE2_RESULTS.md, pass 1).
      KONG_NGINX_EVENTS_WORKER_CONNECTIONS: "16384"
      KONG_NGINX_MAIN_WORKER_RLIMIT_NOFILE: "65536"
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: "512"
      KONG_PROXY_ACCESS_LOG: "off"               # per-request logging would dominate at load-test rates
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
