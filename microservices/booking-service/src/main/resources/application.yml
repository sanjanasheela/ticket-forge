spring:
  application:
    name: booking-service
  config:
    import: classpath:common-application.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/booking_db?reWriteBatchedInserts=true}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 2
    listener:
      concurrency: 3     # one consumer thread per partition of the saga topics (see KAFKA_NUM_PARTITIONS)
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT:8084}

ticketforge:
  reservation:
    url: ${RESERVATION_URL:http://localhost:8083}
  idempotency:
    enabled: true
  payment:
    latency-ms: 150
    jitter-ms: 100
    failure-rate: 0.05
    timeout-rate: 0.0
    reconcile-after: 10s
  saga:
    reply-wait: 5s              # how long the HTTP caller waits for the saga to settle before getting 202
    resend-confirm-after: 15s   # a CHARGED saga with no reply this long gets its command resent
    retry-refund-after: 10s     # a REFUNDING saga this old is refunded again
